name: M4 GPT-4.1 quality spike

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  quality-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      models: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Run one-shot GPT-4.1 fixture quality spike
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGE_TRACE_GPT41_OUTPUT_DIRECTORY: artifacts/gpt41-quality-spike
        run: node scripts/ci/gpt41-quality-spike.mjs
      - name: Upload bounded quality metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: change-trace-gpt41-quality-spike-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: artifacts/gpt41-quality-spike/score.json
      - name: Publish bounded quality summary
        if: always()
        run: node scripts/ci/summarize-gpt41-quality-spike.mjs artifacts/gpt41-quality-spike/score.json >> "$GITHUB_STEP_SUMMARY"
