name: M4 advisory release review

on:
  pull_request:
  pull_request_target:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    if: ${{ github.event_name != 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  advisory-review:
    needs: quality
    if: ${{ always() && github.event_name != 'pull_request' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      models: read
    steps:
      - name: Resolve safe review revisions
        id: revisions
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "pull_request_target" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" =~ ^0+$ ]] || [[ -z "$base" ]]; then base="$head"; fi
          fi
          [[ "$base" =~ ^[a-f0-9]{40}$ ]]
          [[ "$head" =~ ^[a-f0-9]{40}$ ]]
          printf 'base=%s\nhead=%s\n' "$base" "$head" >> "$GITHUB_OUTPUT"

      - name: Check out trusted tooling at the review base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-tooling
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the read-only review subject
        # checkout v7 requires this explicit opt-in for a fork head in a
        # pull_request_target run. The subject is never executed: it is only
        # passed as read-only evidence to trusted MCP Git operations.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Set up trusted Node.js tooling
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install and build trusted tooling without a model credential
        working-directory: trusted-tooling
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install and verify the pinned OpenCode CLI without a model credential
        id: opencode
        working-directory: trusted-tooling
        shell: bash
        run: |
          # OpenCode's pinned package postinstall selects, copies, and verifies
          # its platform binary. This no-credential step intentionally enables it.
          npm install --prefix .opencode --no-save --no-package-lock --audit=false --fund=false opencode-ai@1.18.5
          package_json="$GITHUB_WORKSPACE/trusted-tooling/.opencode/node_modules/opencode-ai/package.json"
          test "$(node -p "require(process.argv[1]).version" "$package_json")" = "1.18.5"
          bin="$(realpath "$GITHUB_WORKSPACE/trusted-tooling/.opencode/node_modules/.bin/opencode")"
          case "$bin" in "$GITHUB_WORKSPACE/trusted-tooling/.opencode/node_modules/"*) ;; *) exit 1 ;; esac
          test "$("$bin" --version)" = "1.18.5"
          printf 'bin=%s\n' "$bin" >> "$GITHUB_OUTPUT"

      - name: Run trusted OpenCode Host with GitHub Models credential
        working-directory: trusted-tooling
        env:
          CHANGE_TRACE_CI_COMMAND: '["node","${{ github.workspace }}/trusted-tooling/scripts/ci/opencode-advisory-host.mjs"]'
          CHANGE_TRACE_CI_REPOSITORY_ROOT: ${{ github.workspace }}/subject
          CHANGE_TRACE_CI_OUTPUT_DIRECTORY: artifacts/advisory
          CHANGE_TRACE_CI_BASE_REVISION: ${{ steps.revisions.outputs.base }}
          CHANGE_TRACE_CI_HEAD_REVISION: ${{ steps.revisions.outputs.head }}
          CHANGE_TRACE_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CHANGE_TRACE_CI_HOST_ID: opencode-ai-1.18.5-github-models
          CHANGE_TRACE_CI_TIMEOUT_MS: '840000'
          CHANGE_TRACE_TRUSTED_TOOLING_ROOT: ${{ github.workspace }}/trusted-tooling
          CHANGE_TRACE_OPENCODE_BIN: ${{ steps.opencode.outputs.bin }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$GITHUB_WORKSPACE/trusted-tooling/scripts/ci/advisory-runner.mjs"

      - name: Upload advisory review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: change-trace-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            subject/artifacts/advisory/release-review.md
            subject/artifacts/advisory/release-review.json
            subject/artifacts/advisory/release-review-status.json

      - name: Publish bounded advisory status summary
        if: always()
        working-directory: trusted-tooling
        run: node scripts/ci/summarize-advisory-status.mjs "$GITHUB_WORKSPACE/subject/artifacts/advisory/release-review-status.json" >> "$GITHUB_STEP_SUMMARY"
