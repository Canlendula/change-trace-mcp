name: M4 deterministic advisory orchestration smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  advisory-smoke:
    needs: quality
    if: ${{ always() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run deterministic Host through the advisory runner
        env:
          CHANGE_TRACE_CI_BASE_REVISION: ${{ github.sha }}
          CHANGE_TRACE_CI_HEAD_REVISION: ${{ github.sha }}
          CHANGE_TRACE_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/ci/smoke-advisory-ci.mjs

      - name: Upload deterministic advisory artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: change-trace-orchestration-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            artifacts/advisory-ci-smoke/release-review.md
            artifacts/advisory-ci-smoke/release-review.json
            artifacts/advisory-ci-smoke/release-review-status.json

      - name: Publish bounded deterministic status summary
        if: always()
        shell: bash
        run: |
          status="artifacts/advisory-ci-smoke/release-review-status.json"
          if [[ -f "$status" ]]; then
            node scripts/ci/summarize-advisory-status.mjs "$status" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Change Trace deterministic advisory status unavailable.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
